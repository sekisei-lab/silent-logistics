<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配車・運行管理デスク</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/truck.svg" type="image/svg+xml">

<style>.site-icon { font-size: 20px; text-align: center; }</style>
</head>
<body>
<div class="pc">
  <header>
    <h1>配車・運行管理デスク</h1>
    <span class="muted small" id="clock"></span>
    <span class="grow"></span>
    <a class="small" href="/">← トップ</a>
  </header>
  <div id="alerts"></div>
  <div class="desk-main">
    <div class="desk-map"><div id="map"></div>
      <div id="vpanel" class="vpanel hidden"></div>
      <div class="legend"><span><i class="dot s-idle"></i>待機（配車可）</span><span><i class="dot s-run"></i>運行中</span><span><i class="dot s-late"></i>遅延</span><span><i class="dot s-alert"></i>要対応</span><span><i class="dot ring"></i>打診中</span></div>
      <div class="small muted desk-cap">マーカーをクリックで詳細／案件カードへドラッグで打診／カードをクリックでルート表示</div></div>
    <div id="board"></div>
  </div>
  <h3>ドライバー・運行管理（点呼・拘束時間・車検）</h3>
  <div class="card" id="drivers"></div>
  <h3>点呼記録簿（本日）</h3>
  <div class="card" id="tenkolog"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="/shared.js"></script>
<script src="/desk/desk.js"></script>
<div id="dtoast" class="toast hidden" style="bottom:24px"></div>
<div id="dragtip" class="dragtip hidden"></div>
</body>
</html>
